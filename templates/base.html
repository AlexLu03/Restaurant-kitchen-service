{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kitchen Service{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

  <div class="fixed-top pt-3">
    <div class="container">
      <nav class="navbar navbar-expand-md navbar-dark navbar-floating">
        <a class="navbar-brand" href="{% url 'index' %}">Kitchen Service</a>
        <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ml-auto align-items-md-center">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'kitchen:dish-list' %}">Dishes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'kitchen:dishtype-list' %}">Dish Types</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'kitchen:cook-list' %}">Cooks</a>
            </li>
            {% if user.is_authenticated %}
              <li class="nav-item ml-md-3">
                <span class="nav-link text-light">{{ user.username }}</span>
              </li>
            {% endif %}
          </ul>
        </div>
      </nav>
    </div>
  </div>

  <div style="padding-top: 6.5rem;">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
