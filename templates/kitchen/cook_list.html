{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Cook List
    <a href="{% url 'kitchen:cook-create' %}" class="btn btn-primary link-to-page">
      Create Cook
    </a>
    <form method="get" action="" class="form-inline">
      {{ search_form|crispy }}
      <input type="Submit" value="Seach" class="btn btn-secondary">
    </form>
  </h1>
  {% if cook_list %}
    <ul>
      {% for cook in cook_list %}
        <li>
          {{cook.username}}
        </li>
    </ul>
  {% else %}
    <p>No cooks in list</p>
  {% endif %}
{% endblock %}
