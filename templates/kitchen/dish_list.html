{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Dish List
    <a href="{% url 'kitchen:dish-create' %}" class="btn btn-primary link-to-page">
      Create Dish
    </a>
  </h1>
  {% if dish_list %}
    <ul>
      {% for dish in dish_list %}
        <li>
          <a href="{% url 'kitchen:dish-detail' dish.pk %}">{{dish.name}}</a>
          <a href="{% url 'kitchen:dish-update' dish.pk %}" class="btn btn-secondary link-to-page">
            Update
          </a>
          <span class="action-separator">/</span>
          <a href="{% url 'kitchen:dish-delete' dish.pk %}" class="btn btn-danger link-to-page">
            Delete
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No dishes in list</p>
  {% endif %}
{% endblock %}
