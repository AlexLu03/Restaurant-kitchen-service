{% extends "base.html" %}

{% block content %}
  <header class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <h1 class="h2 font-weight-bold mb-1">Dish Type List</h1>
        <p class="mb-0" style="color: var(--text-muted);">Categories of dishes in the kitchen</p>
      </div>
      <a href="{% url 'kitchen:dishtype-create' %}" class="btn btn-purple">
        + Create Dish Type
      </a>
    </div>
  </header>

  <main class="container pb-5">
    {% for dish_type in dishtype_list %}
      <div class="item-row-card">
        <div class="item-title">
          {{ dish_type.name }}
        </div>
        <div class="d-flex" style="gap: 0.5rem;">
          <a href="{% url 'kitchen:dishtype-update' pk=dish_type.id %}" class="btn btn-sm btn-outline-bronze">
            Update
          </a>
          <a href="{% url 'kitchen:dishtype-delete' pk=dish_type.id %}" class="btn btn-sm btn-outline-danger-dark">
            Delete
          </a>
        </div>
      </div>
    {% empty %}
      <div class="item-row-card">
        <span style="color: var(--text-muted);">No dish types yet.</span>
      </div>
    {% endfor %}
  </main>
{% endblock %}
