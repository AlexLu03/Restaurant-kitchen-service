{% extends "base.html" %}

{% block content %}
  <h1>Dish Type List
    <a href="{% url 'kitchen:dishtype-create' %}" class="btn btn-primary link-to-page">
      Create Dish Type
    </a>
  </h1>
  {% if dishtype_list %}
    <ul>
      {% for dishtype in dishtype_list %}
        <li>
          Dish type: {{ dishtype.name }}
          <span class="action-separator">/</span>
          <a href="{% url 'kitchen:dishtype-update' dishtype.pk %}" class="btn btn-secondary link-to-page">
            Update
          </a>
          <span class="action-separator">/</span>
          <a href="{% url 'kitchen:dishtype-delete' dishtype.pk %}" class="btn btn-danger link-to-page">
            Delete
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No dish types in list</p>
  {% endif %}
{% endblock %}
