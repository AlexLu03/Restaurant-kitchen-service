{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>
    {% if form.instance.pk %}Update Cook{% else %}Create Cook{% endif %}
  </h1>
  <form method="post" action="">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Create Cook" class="btn btn-primary">
  </form>
{% endblock %}
